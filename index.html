<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Contact Page | devChallenges.io</title>
    <link rel="stylesheet" href="style.css">

  </head>
  <body>

    <div class="logo"><img src="resources/Logo.svg"></div>

    <div class="title-container">
      <div class="title">Interested in our business pricing?</div>
      <div class="sub-title">Fill out the form to view details and we’ll contact you as soon as possible.</div>
    </div>
    <div class="big-container">
    
     <div class="contact-area">
       <div class="grid-area">
         <div class="info">
           <p class="info-type">Name</p>
           <input class="info-area" type="text" placeholder="Ethan Johnson">
         </div>

         <div class="info">
           <p class="info-type">Company Email</p>
           <input class="info-area" type="text" placeholder="ethan@johnson.com">
         </div>

         <div class="info">
           <p class="info-type"> Company Size</p>
           <select class="info-area-selected" id="50-100 employees">
               <option value="50-100 employees" selected>50-100 employees</option>
               <option value="100-200 employees">100-200 employees</option>
               <option value="200-300 employees">200-300 employees</option>
               <option value="300-400 employees" >300-400 employees</option>
             </select>
         </div>

         <div class="info">
           <p class="info-type">Subject</p>
           <select class="info-area-selected" id="Building Landing pages">
               <option value="Building Landing pages" selected>Building Landing pages</option>
               <option value="Building Responsive pages">Building Responsive pages</option>
             </select>
         </div>
        
       </div>
       <div class="message-placehold">
         <p calss="info-type">Message</p>
         <textarea class="message-area"  placeholder=" 50-100 employees"></textarea>
       </div>

       <button class="contact-button">Contact Sales</button>

      </div>
    </div>


    <div class="author-info">
      Coded by <a href="https://github.com/Nibras-Dev06">Nibras-Dev06</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
